<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="雨后的一抹彩虹，一个人撑伞短暂驻足">
  <title>雨后 · 片刻</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F4EA"/>
      <stop offset="0.62" stop-color="#F1F0E6"/>
      <stop offset="1" stop-color="#E8E6DA"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="600" height="600" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="600" height="600" fill="url(#sky)"/>

    <!-- 雨 -->
    <g stroke="#6A9BCC" stroke-width="1.6" stroke-linecap="round" opacity="0.42">
      <line x1="70" y1="40" x2="63" y2="58"/><line x1="132" y1="86" x2="125" y2="104"/>
      <line x1="196" y1="34" x2="189" y2="52"/><line x1="258" y1="72" x2="251" y2="90"/>
      <line x1="322" y1="42" x2="315" y2="60"/><line x1="386" y1="94" x2="379" y2="112"/>
      <line x1="448" y1="38" x2="441" y2="56"/><line x1="512" y1="80" x2="505" y2="98"/>
      <line x1="104" y1="196" x2="97" y2="214"/><line x1="220" y1="168" x2="213" y2="186"/>
      <line x1="346" y1="188" x2="339" y2="206"/><line x1="470" y1="164" x2="463" y2="182"/>
      <line x1="160" y1="292" x2="153" y2="310"/><line x1="404" y1="276" x2="397" y2="294"/>
      <line x1="530" y1="222" x2="523" y2="240"/><line x1="46" y1="264" x2="39" y2="282"/>
    </g>

    <!-- 远山 -->
    <path d="M0 444 Q156 340 324 444 Z" fill="#788C5D" opacity="0.20"/>
    <path d="M240 444 Q444 316 600 438 L600 444 Z" fill="#6A9BCC" opacity="0.16"/>

    <!-- 彩虹 -->
    <g fill="none" stroke-linecap="butt">
      <path d="M120 444 A180 180 0 0 1 480 444" stroke="#CC785C" stroke-width="11.5"/>
      <path d="M131.5 444 A168.5 168.5 0 0 1 468.5 444" stroke="#D4A27F" stroke-width="11.5"/>
      <path d="M143 444 A157 157 0 0 1 457 444" stroke="#E4D3A8" stroke-width="11.5"/>
      <path d="M154.5 444 A145.5 145.5 0 0 1 445.5 444" stroke="#9FB183" stroke-width="11.5"/>
      <path d="M166 444 A134 134 0 0 1 434 444" stroke="#9CC3DD" stroke-width="11.5"/>
      <path d="M177.5 444 A122.5 122.5 0 0 1 422.5 444" stroke="#B0A3E6" stroke-width="11.5"/>
      <path d="M189 444 A111 111 0 0 1 411 444" stroke="#EFC3CE" stroke-width="11.5"/>
    </g>

    <!-- 地平线 -->
    <line x1="0" y1="444" x2="600" y2="444" stroke="#191919" stroke-opacity="0.22" stroke-width="1.4"/>

    <!-- 撑伞驻足的人 -->
    <g transform="translate(180 444)">
      <path d="M-58 -120 A58 58 0 0 1 58 -120 Z" fill="#CC785C" fill-opacity="0.85" stroke="#191919" stroke-opacity="0.35" stroke-width="1.6"/>
      <line x1="0" y1="-120" x2="0" y2="-46" stroke="#191919" stroke-width="2"/>
      <circle cx="0" cy="-62" r="10" fill="#EFD3BC" stroke="#191919" stroke-width="1.8"/>
      <path d="M0 -52 L0 -14 M0 -14 L-11 0 M0 -14 L11 0 M0 -44 L18 -34" fill="none" stroke="#191919" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- 水洼 -->
    <g fill="none" stroke="#6A9BCC" stroke-width="1.4" opacity="0.5">
      <ellipse cx="392" cy="470" rx="34" ry="9"/>
      <ellipse cx="452" cy="502" rx="22" ry="6"/>
      <ellipse cx="256" cy="516" rx="26" ry="7"/>
    </g>
  </g>

  <rect x="0.7" y="0.7" width="598.6" height="598.6" rx="15.3" fill="none" stroke="#191919" stroke-opacity="0.18" stroke-width="1.4"/>
</svg>
